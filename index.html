<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Brüll Dashboard</title>
  <link rel="icon" href="bad/app/img/logo.svg">
  <script>
    /* Startadresse: zuletzt genutzter Bereich (sonst Bad) */
    var b = "bad"; try { b = localStorage.getItem("bruell:bereich") || "bad"; } catch (e) {}
    if (b !== "bad" && b !== "heizung") b = "bad";
    location.replace(b + "/" + location.search + location.hash);
  </script>
</head>
<body><p><a href="bad/">Bad</a> · <a href="heizung/">Heizung</a></p></body>
</html>
