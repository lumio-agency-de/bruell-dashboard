<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Heizungs-Dashboard</title>
  <link rel="icon" href="app/img/logo.svg">
  <link rel="stylesheet" href="app/css/app.css?v=202610251300">
  <link rel="stylesheet" href="../gesamt/dunkel-auto.css?v=202610251253">
  <link rel="stylesheet" href="../gesamt/thema.css?v=202610251253">
  <script src="../gesamt/thema.js?v=202610251253"></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Hauptnavigation">
      <a class="marke" href="#/cockpit">
        <img class="marke-logo" id="marke-logo" src="app/img/logo.svg" alt="">
        <span class="marke-text"><strong id="marke-name">Heizungs-Dashboard</strong><small id="marke-bereich">Heizungsbau</small></span>
      </a>
      <nav class="nav">
        <a href="#/cockpit" data-nav="cockpit"><span class="nav-i i-cockpit" aria-hidden="true"></span>Cockpit</a>
        <a href="#/projekte" data-nav="projekte"><span class="nav-i i-projekte" aria-hidden="true"></span>Projekte</a>
        <a href="#/einrichtung" data-nav="einrichtung"><span class="nav-i i-einrichtung" aria-hidden="true"></span>Einrichtung</a>
      </nav>
      <div class="speicher" id="speicher" aria-live="polite"></div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <noscript><p class="noscript">Bitte JavaScript aktivieren.</p></noscript>
    </main>
  </div>

  <dialog class="dlg" id="dlg"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="levelup" id="levelup" aria-live="polite"></div>
  <div id="druck" class="druck" aria-hidden="true"></div>

  <script src="einstellungen/firma.js?v=202610251300"></script>
  <script src="einstellungen/ablauf.js?v=202610251300"></script>
  <script src="einstellungen/formulare.js?v=202610251300"></script>
  <script src="einstellungen/mailvorlagen.js?v=202610251300"></script>
  <script src="app/vendor/supabase.js?v=202610251300"></script>
  <script src="app/js/daten.js?v=202610251300"></script>
  <script src="app/js/formular.js?v=202610251300"></script>
  <script src="app/js/app.js?v=202610251300"></script>
  <link rel="stylesheet" href="../gesamt/bereiche.css?v=202610251253">
  <script src="../gesamt/bereiche.js?v=202610251253" data-bereich="heizung"></script>
</body>
</html>
